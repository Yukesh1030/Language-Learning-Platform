<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STACKLY - Page Not Found</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--bg-color);
      position: relative;
      overflow: hidden;
      padding: 20px;
    }
    .error-code {
      font-size: 10rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 20px;
      text-shadow: 10px 10px 0px rgba(0,0,0,0.05);
    }
    .error-msg {
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 30px;
    }
    .floating-items i {
      position: absolute;
      color: rgba(0,0,0,0.05);
      font-size: 3rem;
    }
  </style>
</head>
<body>

  <div class="loader">
    <div class="loader-inner"></div>
  </div>

  <div class="error-page">
    <div class="floating-items" id="floaters">
      <i class="fa-solid fa-language" style="top: 20%; left: 15%;"></i>
      <i class="fa-solid fa-earth-americas" style="top: 70%; left: 20%;"></i>
      <i class="fa-solid fa-comments" style="top: 30%; right: 15%;"></i>
      <i class="fa-solid fa-book" style="top: 60%; right: 25%;"></i>
    </div>
    
    <div class="error-content" id="error-content">
      <div class="error-code">404</div>
      <div class="error-msg">Oops! Looks like you're lost in translation.</div>
      <p style="margin-bottom: 40px; color: var(--text-light); max-width: 500px; margin-left: auto; margin-right: auto;">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
      </p>
      
      <div style="display: flex; gap: 20px; justify-content: center;">
        <button onclick="history.back()" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Go Back</button>
        <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Back to Home</a>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 404 entrance animation
      gsap.from("#error-content", {
        y: 100,
        opacity: 0,
        duration: 1.5,
        ease: "elastic.out(1, 0.7)",
        delay: 0.5
      });
      
      // Floating items animation
      gsap.to(".floating-items i", {
        y: "random(-30, 30)",
        x: "random(-30, 30)",
        rotation: "random(-20, 20)",
        duration: "random(3, 5)",
        repeat: -1,
        yoyo: true,
        ease: "sine.inOut",
        stagger: 0.2
      });
    });
  </script>
</body>
</html>
