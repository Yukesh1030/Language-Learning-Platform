<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress & Achievements | STACKLY</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: '#FF7A00', secondary: '#FFFFFF', accent: '#2F2F2F' }, fontFamily: { sans: ['Poppins', 'sans-serif'] } }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="bg-accent text-white w-64 flex-shrink-0 flex flex-col transition-all duration-300 md:translate-x-0 -translate-x-full fixed md:relative z-40 h-full shadow-2xl">
        <div class="p-6 flex items-center justify-between">
            <a href="index.html" class="block"><img src="asstes/Brand-logo.webp" alt="STACKLY" class="h-8" onerror="this.src='https://via.placeholder.com/100x30?text=STACKLY'"></a>
            <button id="close-sidebar" class="md:hidden text-white hover:text-primary transition"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div class="px-6 py-4 border-b border-white/10">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-primary text-white flex items-center justify-center font-bold text-xl shadow-lg border-2 border-white/20">CU</div>
                <div><h3 class="font-bold text-sm tracking-wide">Client User</h3><p class="text-xs text-gray-300">client@example.com</p></div>
            </div>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 custom-scrollbar">
            <div class="mb-1"><a href="ClientDashboard.html" class="w-full px-6 py-3 flex items-center gap-4 text-left text-gray-300 hover:bg-white/5 hover:text-white transition-colors focus:outline-none"><i class="fas fa-th-large w-5 text-center"></i> Dashboard</a></div>
            <div class="mb-1"><a href="ClientMyCourses.html" class="w-full px-6 py-3 flex items-center gap-4 text-left text-gray-300 hover:bg-white/5 hover:text-white transition-colors focus:outline-none"><i class="fas fa-graduation-cap w-5 text-center"></i> My Courses</a></div>
            <div class="mb-1"><a href="ClientPracticeCenter.html" class="w-full px-6 py-3 flex items-center gap-4 text-left text-gray-300 hover:bg-white/5 hover:text-white transition-colors focus:outline-none"><i class="fas fa-dumbbell w-5 text-center"></i> Practice Center</a></div>
            <div class="mb-1"><a href="ClientProgress.html" class="w-full px-6 py-3 flex items-center gap-4 text-left bg-white/10 border-l-4 border-primary font-semibold focus:outline-none"><i class="fas fa-trophy w-5 text-center text-primary"></i> Progress</a></div>
            <div class="mb-1"><a href="ClientProfile.html" class="w-full px-6 py-3 flex items-center gap-4 text-left text-gray-300 hover:bg-white/5 hover:text-white transition-colors focus:outline-none"><i class="fas fa-user-circle w-5 text-center"></i> Profile Settings</a></div>
        </nav>
        <div class="p-6 border-t border-white/10"><a href="Login.html" class="w-full flex items-center gap-3 text-red-400 hover:text-red-300 transition-colors font-semibold"><i class="fas fa-sign-out-alt"></i> Logout</a></div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="bg-white h-20 px-8 flex items-center justify-between shadow-sm z-30">
            <div class="flex items-center gap-4">
                <button id="open-sidebar" class="md:hidden text-gray-500 hover:text-primary transition"><i class="fas fa-bars text-2xl"></i></button>
                <h1 class="text-xl font-bold text-accent hidden sm:block">Achievements</h1>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-6 md:p-8 bg-gray-50">
            <div class="mb-8"><h2 class="text-2xl font-bold text-gray-900">Your Badges</h2></div>
            <div class="flex gap-4 flex-wrap">
                <div class="w-32 h-32 bg-white rounded-2xl shadow-sm border-2 border-primary flex flex-col items-center justify-center">
                    <i class="fas fa-fire text-3xl text-primary mb-2"></i>
                    <span class="text-xs font-bold text-gray-700">7 Day Streak</span>
                </div>
                <div class="w-32 h-32 bg-white rounded-2xl shadow-sm border-2 border-gray-200 flex flex-col items-center justify-center opacity-50">
                    <i class="fas fa-fire text-3xl text-gray-400 mb-2"></i>
                    <span class="text-xs font-bold text-gray-400">30 Day Streak</span>
                </div>
                <div class="w-32 h-32 bg-white rounded-2xl shadow-sm border-2 border-yellow-500 flex flex-col items-center justify-center">
                    <i class="fas fa-star text-3xl text-yellow-500 mb-2"></i>
                    <span class="text-xs font-bold text-gray-700">Perfect Score</span>
                </div>
            </div>
        </div>
    </main>
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>
    <script>
        const sidebar = document.getElementById('sidebar');
        const openBtn = document.getElementById('open-sidebar');
        const closeBtn = document.getElementById('close-sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        function toggleSidebar() {
            if(sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden');
            }
        }
        openBtn.addEventListener('click', toggleSidebar);
        closeBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);
    </script>
    <script src="js/dashboard-profile.js"></script>
</body>
</html>
